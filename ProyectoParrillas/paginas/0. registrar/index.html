<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta y regístrate para acceder a nuestros servicios de forma rápida y sencilla.">
    
    
    <!--Importación desde GoogleFont para las fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Fjalla+One&display=swap" rel="stylesheet">


    <!--Título y la conexión a css-->
    <title>La Vaca Roja — Registrarse</title>
    <link rel="stylesheet" href="../../estilos/estilos_registrar.css">
    <link rel="stylesheet" href="../../estilos/estilos_global.css">

</head>


<body>

    <!---------BARRA DE NAVEGACIÓN---------->
<nav>

    <figure>
        <img class="logo-principal" src="../../img/logo_empresa.png" alt="Logo La Vaca Roja">
    </figure>
    
    
    <ul>
        <li><a href="../../index.html">INICIO</a></li>
        <li><a href="../../paginas/1. carnes/index.html">CARNES</a></li>
        <li><a href="../../paginas/2. cava-bar/index.html">CAVA/BAR</a></li>
        <li><a href="../../paginas/3. nosotros/index.html">NOSOTROS</a></li>
        <li><a href="../../paginas/4. sedes/index.html">SEDES</a></li>
        <li><a href="../../paginas/5. reservar/index.html">RESERVAR</a></li>
        <li class="boton-login"><a href="../../paginas/0. login/index.html">Iniciar Sesión</a></li>
    </ul>

</nav>



  <main class="registro-seccion">
    <p class="hero-eyebrow">Nuevos clientes</p>
    <h1>Únete a<br>la mesa</h1>
    <p class="eslogan">El lugar perfecto para los amantes de la carne</p>
    <div class="divider-flame"></div>

    <div class="card">
      <form id="register-form">
        <div class="input-box">
          <label for="reg-name">Nombre completo</label>
          <input type="text" id="reg-name" placeholder="Tu nombre" required>
        </div>

        <div class="row-two">
          <div class="input-box">
            <label for="reg-email">Correo</label>
            <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="input-box">
            <label for="reg-phone">Teléfono</label>
            <input type="tel" id="reg-phone" placeholder="+51 999 999 999" maxlength="9" required pattern="[0-9]+">
          </div>
        </div>

        <div class="row-two">
          <div class="input-box">
            <label for="reg-pass">Contraseña</label>
            <input type="password" id="reg-pass" placeholder="••••••••" required>
          </div>
          <div class="input-box">
            <label for="reg-pass2">Confirmar</label>
            <input type="password" id="reg-pass2" placeholder="••••••••" required>
          </div>
        </div>

        <div class="fine-print">
          <label class="checkbox-line">
            <input type="checkbox" required>
            <span>Acepto los términos del restaurante y la política de reservas.</span>
          </label>
        </div>
        <button type="submit" class="btn-principal">Crear cuenta</button>

        <p class="switch-line">¿Ya tienes cuenta? <a class="link-red" href="../0. login/index.html">Inicia sesión</a></p>
      </form>
    </div>
  </main>




</body>

</html>
